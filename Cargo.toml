[package]
name = "flow"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
eframe = "0.27.2"
tray-icon = "0.14.3"
arboard = "3.4.0"
walkdir = "2.5.0"
once_cell = "1.19.0"
directories = "5.0.1"
webbrowser = "1.0.15"
image = "0.25.0"
log = "0.4"
simplelog = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.0"
rcgen = "0.13"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
rustls-pemfile = "2.1"



[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25.0"
core-graphics = "0.23.0"
objc = "0.2.7"
libc = "0.2.155"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"


