name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-prefix: flow-windows
            extension: setup.exe
          - os: ubuntu-latest
            os-name: Linux
            artifact-prefix: flow-linux
            extension: tar.gz
          - os: macos-13
            os-name: macOS Intel
            artifact-prefix: flow-macos-intel
            extension: dmg
          - os: macos-14
            os-name: macOS Apple Silicon
            artifact-prefix: flow-macos-arm64
            extension: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxmu-dev libasound2-dev

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Build Windows Setup Installer (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "") { $tag = "dev" }
          # Compile Inno Setup Installer
          iscc installer/flow.iss
          # Rename output installer file to match matrices prefix
          Move-Item -Path "dist/flow.setup.exe" -Destination "${{ matrix.artifact-prefix }}-$tag.${{ matrix.extension }}"

      - name: Build macOS DMG Installer (macOS only)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then TAG_NAME="dev"; fi
          # Prepare temporary bundle directory
          mkdir -p dmg_root/flow
          cp target/release/flow dmg_root/flow/flow
          cp -r resources dmg_root/flow/resources
          # Build native macOS DMG using hdiutil
          hdiutil create -volname "flow" -srcfolder dmg_root/flow -ov -format UDZO "${{ matrix.artifact-prefix }}-${TAG_NAME}.${{ matrix.extension }}"

      - name: Build Linux tar.gz Bundle (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then TAG_NAME="dev"; fi
          mkdir -p dist
          cp target/release/flow dist/flow
          cp -r resources dist/resources
          cp installer/setup_linux.sh dist/setup.sh
          cp installer/flow.desktop dist/
          tar -czf "${{ matrix.artifact-prefix }}-${TAG_NAME}.${{ matrix.extension }}" -C dist flow resources setup.sh flow.desktop

      - name: Determine upload asset
        id: asset
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then TAG_NAME="dev"; fi
          FILE_NAME="${{ matrix.artifact-prefix }}-${TAG_NAME}.${{ matrix.extension }}"
          if [ -f "$FILE_NAME" ]; then
            echo "file=$FILE_NAME" >> $GITHUB_OUTPUT
          else
            echo "No artifact found to upload!"
            exit 1
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.file }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
