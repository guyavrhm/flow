name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-prefix: flow-windows
            extension: setup.exe
            local-path: dist/flow.setup.exe
          - os: ubuntu-latest
            os-name: Linux
            artifact-prefix: flow-linux
            extension: tar.gz
            local-path: dist/flow.tar.gz
          - os: macos-13
            os-name: macOS Intel
            artifact-prefix: flow-macos-intel
            extension: dmg
            local-path: dist/flow.dmg
          - os: macos-14
            os-name: macOS Apple Silicon
            artifact-prefix: flow-macos-arm64
            extension: dmg
            local-path: dist/flow.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up MinGW (Windows only)
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run build script
        run: python installer/build.py

      - name: Rename and prepare artifacts
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          FINAL_NAME="${{ matrix.artifact-prefix }}-${TAG_NAME}.${{ matrix.extension }}"
          echo "FINAL_NAME=${FINAL_NAME}" >> $GITHUB_ENV
          if [ -f "${{ matrix.local-path }}" ]; then
            mv "${{ matrix.local-path }}" "${FINAL_NAME}"
          elif [ "${{ matrix.os-name }}" = "Windows" ] && [ -f "dist/flow-windows.zip" ]; then
            mv "dist/flow-windows.zip" "${{ matrix.artifact-prefix }}-${TAG_NAME}.zip"
            echo "FINAL_NAME=${{ matrix.artifact-prefix }}-${TAG_NAME}.zip" >> $GITHUB_ENV
          else
            echo "Error: Output file not found!"
            exit 1
          fi

      - name: Determine upload asset
        id: asset
        shell: bash
        run: |
          if [ -f "${{ env.FINAL_NAME }}" ]; then
            echo "file=${{ env.FINAL_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "No artifact found to upload!"
            exit 1
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.file }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
